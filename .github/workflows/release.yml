name: Release

# A tag like v0.3.0 builds the Linux export and attaches it to a GitHub release of the same name.
# "Run workflow" from the Actions tab builds the same thing from any branch as a downloadable artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q /tmp/templates.tpz 'templates/linux_release.x86_64' 'templates/linux_debug.x86_64' -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Export
        run: |
          set -eu
          mkdir -p build/linux
          ~/godot/godot --headless --path . --export-release "Linux" build/linux/blacksite.x86_64
          test -x build/linux/blacksite.x86_64

      - name: Package
        id: pkg
        run: |
          set -eu
          ver="${GITHUB_REF_NAME}"
          case "$ver" in v*) ;; *) ver="dev-$(git rev-parse --short HEAD)";; esac
          name="blacksite-${ver}-linux-x86_64"
          mkdir -p "dist/$name/assets"
          cp build/linux/blacksite.x86_64 "dist/$name/blacksite"
          # the voice takes are plain files the game reads from beside the binary (assets/voice is .gdignore'd)
          cp -r assets/voice "dist/$name/assets/voice"
          rm -f "dist/$name/assets/voice/.gdignore"
          cp README.md "dist/$name/"
          printf 'Run ./blacksite (keep the assets folder next to it: it holds the voices).\n\nFirst launch synthesizes the sound bank (a few seconds).\nSettings and quicksaves live under ~/.local/share/godot/app_userdata/Blacksite/\n' > "dist/$name/RUN.txt"
          echo "dir=dist/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Smoke test the packaged build
        run: |
          set -eu
          cd "${{ steps.pkg.outputs.dir }}"
          timeout 900 ./blacksite --headless -- --autotest > autotest.log 2>&1 || echo "exit code $? (checked by content below)"
          grep '^AUTOTEST ' autotest.log | grep -q '"voice_ok":true'
          ! grep -q 'SCRIPT ERROR' autotest.log
          rm -f autotest.log

      - name: Archive
        id: tar
        run: |
          set -eu
          (cd dist && tar -czf "${{ steps.pkg.outputs.name }}.tar.gz" "${{ steps.pkg.outputs.name }}")
          echo "archive=dist/${{ steps.pkg.outputs.name }}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.tar.outputs.archive }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${{ steps.tar.outputs.archive }}" --clobber
          else
            gh release create "$tag" "${{ steps.tar.outputs.archive }}" --title "Blacksite $tag" --generate-notes
          fi
