name: Release

# A tag like v0.3.0 exports Linux, Windows and macOS builds and attaches them to a GitHub release of
# the same name. "Run workflow" from the Actions tab builds the same from any branch as an artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    name: Linux, Windows and macOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-windows-macos

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q /tmp/templates.tpz 'templates/linux_release.x86_64' 'templates/linux_debug.x86_64' \
            'templates/windows_release_x86_64.exe' 'templates/windows_debug_x86_64.exe' \
            'templates/windows_release_x86_64_console.exe' 'templates/windows_debug_x86_64_console.exe' \
            'templates/macos.zip' -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Import project
        run: ~/godot/godot --headless --path . --import

      - name: Export
        run: |
          set -eu
          mkdir -p build/linux build/windows build/macos
          ~/godot/godot --headless --path . --export-release "Linux" build/linux/blacksite.x86_64
          ~/godot/godot --headless --path . --export-release "Windows" build/windows/blacksite.exe
          ~/godot/godot --headless --path . --export-release "macOS" build/macos/Blacksite.zip
          test -x build/linux/blacksite.x86_64 && test -s build/windows/blacksite.exe && test -s build/macos/Blacksite.zip

      - name: Smoke test the Linux export
        run: |
          set -eu
          cd build/linux
          timeout 900 ./blacksite.x86_64 --headless -- --autotest > autotest.log 2>&1 || echo "exit code $? (checked by content below)"
          grep '^AUTOTEST ' autotest.log | grep -q '"voice_ok":true'
          ! grep -q 'SCRIPT ERROR' autotest.log
          rm -f autotest.log

      - name: Package
        id: pkg
        run: |
          set -eu
          ver="${GITHUB_REF_NAME}"
          case "$ver" in v*) ;; *) ver="dev-$(git rev-parse --short HEAD)";; esac
          base="blacksite-${ver}"
          mkdir -p dist
          # Linux: a single binary with the data embedded
          d="dist/$base-linux-x86_64"; mkdir -p "$d"
          cp build/linux/blacksite.x86_64 "$d/blacksite"
          cp README.md "$d/"
          printf 'Run ./blacksite\n\nFirst launch synthesizes the sound bank (a few seconds).\nSettings and quicksaves: ~/.local/share/godot/app_userdata/Blacksite/\n' > "$d/RUN.txt"
          (cd dist && tar -czf "$base-linux-x86_64.tar.gz" "$base-linux-x86_64")
          # Windows: a single exe, unsigned (SmartScreen will ask once)
          d="dist/$base-windows-x86_64"; mkdir -p "$d"
          cp build/windows/blacksite.exe "$d/blacksite.exe"
          cp README.md "$d/"
          printf 'Run blacksite.exe\r\n\r\nThe exe is not code-signed, so SmartScreen may ask once: More info > Run anyway.\r\nFirst launch synthesizes the sound bank (a few seconds).\r\nSettings and quicksaves: %%APPDATA%%\\Godot\\app_userdata\\Blacksite\\\r\n' > "$d/RUN.txt"
          (cd dist && zip -qr "$base-windows-x86_64.zip" "$base-windows-x86_64")
          # macOS: the universal app bundle, ad-hoc signed, not notarized
          cp build/macos/Blacksite.zip "dist/$base-macos-universal.zip"
          ls -la dist/*.tar.gz dist/*.zip
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.base }}
          path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/*.zip --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/*.zip --title "Blacksite $tag" --generate-notes
          fi
